[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-monitor"
version = "0.1.0"
description = "Local-first Codex task monitoring, session visibility, and human approvals."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "yyt-2378"}]
keywords = ["codex", "monitoring", "approvals", "fastapi", "pwa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "httpx>=0.28,<1",
  "playwright>=1.55,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[project.scripts]
codex-monitor = "codex_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/yyt-2378/Codex_Monitor"
Repository = "https://github.com/yyt-2378/Codex_Monitor"
Issues = "https://github.com/yyt-2378/Codex_Monitor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_monitor"]

[tool.hatch.build]
include = [
  "src/codex_monitor/**/*.py",
  "src/codex_monitor/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
